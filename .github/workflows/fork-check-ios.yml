name: Fork Check iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'native/**'
      - '.github/workflows/fork-check-ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  compile-ios:
    name: Compile iOS without code signing
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Select the newest installed Xcode 27
        run: |
          xcode_27=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)
          if [[ -n "$xcode_27" ]]; then
            sudo xcode-select -s "${xcode_27}/Contents/Developer"
          else
            echo "::warning::Xcode 27 is not installed on this runner image, building with the default Xcode."
          fi
          xcodebuild -version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore Rust Cache
        id: cache-rust-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-check-ios-rust-${{ runner.os }}-${{ hashFiles('native/crates/native_core_ffi/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: |
            fork-check-ios-rust-${{ runner.os }}-

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Install Ruby gems
        working-directory: ./mobile/ios
        run: bundle install

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Build iOS without code signing
        working-directory: ./mobile
        run: flutter build ios --release --no-codesign

      - name: Save Rust Cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ github.ref_name == github.event.repository.default_branch && steps.cache-rust-restore.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache-rust-restore.outputs.cache-primary-key }}
