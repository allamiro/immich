# Mutation tests for the fork's "Move to album" feature. Fork Sync Upstream calls this workflow together
# with Fork Regression after every merge; both must be green before a release is tagged or a build starts.
#
#   web     Stryker on moveAssetsToAlbumMutation and notifyMoveToAlbum in web/src/lib/queries/album.query.ts
#   server  Stryker on moveAssets in server/src/services/album.service.ts
#   mobile  Dart has no maintained mutation testing tool that parses the language. The pub.dev package
#           mutation_test does regular expression replacements on line ranges: it counts mutants that no
#           longer compile as detected and its line ranges move whenever upstream edits a file. The mobile
#           job therefore runs the fork's own runner, .github/mutation/dart/run.py, with a fixed list of
#           hand-written mutants in .github/mutation/dart/mutants.json. It covers the move chain only (API
#           repository, service, local repository, notifier, action), not the rest of the app, and it
#           finds no mutants on its own: new move code needs new entries in mutants.json. Each mutant is
#           applied in a temporary copy of mobile/lib, so the checkout is never modified.
#
# The break thresholds live in .github/mutation/stryker.*.config.json and .github/mutation/dart/mutants.json.

name: Fork Mutation Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which part of the move feature to mutate
        type: choice
        options:
          - all
          - web
          - server
          - mobile
        default: all
      full:
        description: Ignore the cached incremental Stryker results and run every mutant
        type: boolean
        default: false
      ref:
        description: Branch, tag or commit to test. Empty tests the branch the workflow is started from.
        required: false
        type: string
  workflow_call:
    inputs:
      target:
        description: Which part of the move feature to mutate (all, web, server or mobile)
        type: string
        default: all
      full:
        description: Ignore the cached incremental Stryker results and run every mutant
        type: boolean
        default: false
      ref:
        description: Branch, tag or commit to test. Empty tests the ref of the calling workflow.
        required: false
        type: string
  pull_request:
    paths:
      - 'web/src/lib/queries/album.query.ts'
      - 'web/src/lib/queries/album.query.spec.ts'
      - 'server/src/services/album.service.ts'
      - 'server/src/services/album.service.spec.ts'
      - 'mobile/lib/**/*album*'
      - 'mobile/test/**/*album*'
      - '.github/mutation/**'
      - '.github/workflows/fork-mutation-test.yml'

concurrency:
  group: fork-mutation-test-${{ inputs.ref || github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

env:
  STRYKER_VERSION: 10.1.1

jobs:
  select-targets:
    name: Select targets
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      mobile: ${{ steps.select.outputs.mobile }}
    steps:
      - name: Select the requested targets
        id: select
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
          WEB_TARGET: '{"target":"web","directory":"web","functions":"moveAssetsToAlbumMutation notifyMoveToAlbum","setup-tasks":"//:sdk:install //:sdk:build //web:install //web:playwright-install"}'
          SERVER_TARGET: '{"target":"server","directory":"server","functions":"moveAssets","setup-tasks":"//server:install //:plugins"}'
        run: |
          mobile=false
          case "$REQUESTED_TARGET" in
            all)
              targets="[${WEB_TARGET},${SERVER_TARGET}]"
              mobile=true
              ;;
            web) targets="[${WEB_TARGET}]" ;;
            server) targets="[${SERVER_TARGET}]" ;;
            mobile)
              targets='[]'
              mobile=true
              ;;
            *)
              echo "::error::target must be all, web, server or mobile, got '${REQUESTED_TARGET}'."
              exit 1
              ;;
          esac
          {
            echo "targets=${targets}"
            echo "mobile=${mobile}"
          } | tee -a "$GITHUB_OUTPUT"

  mutation-test:
    name: Mutation test ${{ matrix.target }}
    needs: select-targets
    if: ${{ github.repository_owner != 'immich-app' && needs.select-targets.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      TARGET_DIRECTORY: ${{ matrix.directory }}
      MUTATED_FUNCTIONS: ${{ matrix.functions }}
      STRYKER_CONFIG_PATH: .github/mutation/stryker.${{ matrix.target }}.config.json
      INCREMENTAL_FILE: ${{ matrix.directory }}/reports/stryker-incremental.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the mutation scope
        id: scope
        working-directory: ${{ matrix.directory }}
        run: |
          stryker_config="${GITHUB_WORKSPACE}/${STRYKER_CONFIG_PATH}"
          mutated_file=$(jq -r '.mutate[0]' "$stryker_config")
          test_file=$(jq -r '.testFiles[0]' "$stryker_config")
          for required_file in "$mutated_file" "$test_file"; do
            if [[ ! -f "$required_file" ]]; then
              echo "::error::${TARGET_DIRECTORY}/${required_file} does not exist on this ref."
              exit 1
            fi
          done

          ranges=()
          for function_name in ${MUTATED_FUNCTIONS}; do
            if ! line_range=$(awk -v name="$function_name" '
              !first_line && $0 ~ "^[ \t]*(export[ \t]+)?((const|async|function)[ \t]+)+" name "[ \t]*[=(<]" {
                first_line = NR
                last_line = NR
                match($0, /^[ \t]*/)
                indentation = RLENGTH
                next
              }
              first_line && !closed && $0 !~ /^[ \t]*$/ {
                match($0, /^[ \t]*/)
                rest = substr($0, RLENGTH + 1)
                if (RLENGTH == indentation && rest ~ /^[]})]+;?$/) {
                  last_line = NR
                  closed = 1
                  exit
                }
                if (RLENGTH <= indentation && rest !~ /^[]})]/) {
                  closed = 1
                  exit
                }
                last_line = NR
              }
              END {
                if (!first_line) {
                  exit 1
                }
                print first_line "-" last_line
              }
            ' "$mutated_file"); then
              echo "::error::${function_name} was not found in ${TARGET_DIRECTORY}/${mutated_file}."
              exit 1
            fi
            ranges+=("${mutated_file}:${line_range}")
          done

          mutate=$(IFS=,; echo "${ranges[*]}")
          echo "mutate=${mutate}" | tee -a "$GITHUB_OUTPUT"

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}

      - name: Install dependencies
        env:
          SETUP_TASKS: ${{ matrix.setup-tasks }}
        run: |
          for task in ${SETUP_TASKS}; do
            mise run "$task"
          done

      - name: Install Stryker outside the workspace
        run: |
          stryker_home="${RUNNER_TEMP}/stryker"
          mkdir -p "$stryker_home"
          npm install --prefix "$stryker_home" --no-audit --no-fund --no-package-lock --ignore-scripts --legacy-peer-deps \
            "@stryker-mutator/core@${STRYKER_VERSION}" \
            "@stryker-mutator/vitest-runner@${STRYKER_VERSION}" \
            "@stryker-mutator/typescript-checker@${STRYKER_VERSION}"
          for peer in vitest typescript; do
            ln -s "${GITHUB_WORKSPACE}/${TARGET_DIRECTORY}/node_modules/${peer}" "${stryker_home}/node_modules/${peer}"
          done

      - name: Restore incremental results
        if: ${{ !inputs.full }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: fork-mutation-test-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fork-mutation-test-${{ matrix.target }}-

      - name: Run Stryker
        working-directory: ${{ matrix.directory }}
        env:
          FULL_RUN: ${{ inputs.full || false }}
          MUTATE: ${{ steps.scope.outputs.mutate }}
        run: |
          stryker_arguments=(run "${GITHUB_WORKSPACE}/${STRYKER_CONFIG_PATH}" --incremental)
          if [[ "$FULL_RUN" == true ]]; then
            stryker_arguments+=(--force)
          fi
          if [[ -n "$MUTATE" ]]; then
            stryker_arguments+=(--mutate "$MUTATE")
          fi
          node "${RUNNER_TEMP}/stryker/node_modules/@stryker-mutator/core/bin/stryker.js" "${stryker_arguments[@]}"

      - name: Summarize the mutation score
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.directory }}
        env:
          MUTATE: ${{ steps.scope.outputs.mutate }}
        run: |
          report=reports/mutation/mutation.json
          if [[ ! -f "$report" ]]; then
            echo "### Mutation test: ${TARGET}" >> "$GITHUB_STEP_SUMMARY"
            echo "Stryker did not produce a report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -r --arg target "$TARGET" --arg scope "${MUTATE:-whole file}" \
            --slurpfile config "${GITHUB_WORKSPACE}/${STRYKER_CONFIG_PATH}" '
            [.files | to_entries[] | .key as $file | .value.mutants[] | . + {file: $file}] as $mutants
            | ($mutants | map(select(.status == "Killed" or .status == "Timeout")) | length) as $detected
            | ($mutants | map(select(.status == "Survived")) | length) as $survived
            | ($mutants | map(select(.status == "NoCoverage")) | length) as $uncovered
            | ($detected + $survived + $uncovered) as $valid
            | (if $valid == 0 then "n/a" else ((($detected / $valid) * 10000 | round) / 100 | tostring) + " %" end) as $score
            | "### Mutation test: \($target)",
              "",
              "Scope: `\($scope)`",
              "",
              "| Mutation score | Detected | Survived | No coverage | Thresholds |",
              "| --- | --- | --- | --- | --- |",
              "| \($score) | \($detected) | \($survived) | \($uncovered) | break \($config[0].thresholds.break), low \($config[0].thresholds.low), high \($config[0].thresholds.high) |",
              "",
              (if ($survived + $uncovered) == 0 then "No surviving mutants." else "Surviving and uncovered mutants:" end),
              "",
              ($mutants[] | select(.status == "Survived" or .status == "NoCoverage")
                | "- `\(.file):\(.location.start.line)` \(.mutatorName) (\(.status))")
          ' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-report-${{ matrix.target }}
          path: |
            ${{ matrix.directory }}/reports/mutation/mutation.html
            ${{ matrix.directory }}/reports/mutation/mutation.json
          if-no-files-found: warn

      - name: Save incremental results
        if: ${{ !cancelled() && hashFiles(env.INCREMENTAL_FILE) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: fork-mutation-test-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

  mutation-test-mobile:
    name: Mutation test mobile
    needs: select-targets
    if: ${{ github.repository_owner != 'immich-app' && needs.select-targets.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check the mutant definitions still match the move code
        run: python3 .github/mutation/dart/run.py --mobile-dir mobile --list

      - name: Restore Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-mobile-rust-${{ runner.os }}-${{ hashFiles('native/crates/native_core_ffi/rust-toolchain.toml', 'mobile/mise.lock', 'native/Cargo.lock') }}
          restore-keys: |
            fork-mobile-rust-${{ runner.os }}-

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Install dependencies
        run: mise run //mobile:install:ci

      - name: Generate code and translations
        run: mise run //mobile:codegen

      - name: Run the mutants
        run: python3 .github/mutation/dart/run.py --mobile-dir mobile --report-dir "${RUNNER_TEMP}/mutation-report-mobile"

      - name: Summarize the mutation score
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "${RUNNER_TEMP}/mutation-report-mobile/mutation.md" ]]; then
            cat "${RUNNER_TEMP}/mutation-report-mobile/mutation.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Mutation test: mobile"
              echo
              echo "The runner did not produce a report. See the job log: the tests failed without a mutation or a mutant definition no longer matches the source."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-report-mobile
          path: ${{ runner.temp }}/mutation-report-mobile
          if-no-files-found: warn
