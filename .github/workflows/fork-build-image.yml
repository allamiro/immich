name: Fork Build Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build. Empty builds the branch the workflow is started from.
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  resolve-source:
    name: Resolve source and tags
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.source.outputs.image }}
      cache-image: ${{ steps.source.outputs.cache-image }}
      cache-scope: ${{ steps.source.outputs.cache-scope }}
      default-branch-cache-scope: ${{ steps.source.outputs.default-branch-cache-scope }}
      source-ref: ${{ steps.source.outputs.source-ref }}
      source-commit: ${{ steps.source.outputs.source-commit }}
      build-image: ${{ steps.source.outputs.build-image }}
      tags: ${{ steps.source.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve image name, source and tags
        id: source
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sanitize_tag() {
            sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//' <<< "$1" | cut -c 1-128
          }

          source_ref="${REQUESTED_REF:-$TRIGGER_REF_NAME}"
          source_ref="${source_ref#refs/heads/}"
          source_ref="${source_ref#refs/tags/}"
          source_commit=$(git rev-parse HEAD)
          ref_tag=$(sanitize_tag "$source_ref")
          image="ghcr.io/${OWNER,,}/immich-server"

          tags=("$ref_tag" "${source_commit::7}")
          publish_latest=false
          if [[ "$source_ref" == "$DEFAULT_BRANCH" ]]; then
            publish_latest=true
          fi
          if [[ "$source_ref" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?)$ ]]; then
            tags+=("${BASH_REMATCH[1]}")
            if [[ "$source_ref" =~ -fork\.[0-9]+$ ]]; then
              publish_latest=true
            fi
          fi
          if [[ "$publish_latest" == true ]]; then
            tags+=(latest)
          fi
          unique_tags=$(printf '%s\n' "${tags[@]}" | awk 'NF && !seen[$0]++' | paste -sd ' ' -)

          {
            echo "image=${image}"
            echo "cache-image=${image}-build-cache"
            echo "cache-scope=${ref_tag}"
            echo "default-branch-cache-scope=$(sanitize_tag "$DEFAULT_BRANCH")"
            echo "source-ref=${source_ref}"
            echo "source-commit=${source_commit}"
            echo "build-image=${ref_tag}"
            echo "tags=${unique_tags}"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve-source
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform-pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform-pair: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.resolve-source.outputs.image }}
      CACHE_IMAGE: ${{ needs.resolve-source.outputs.cache-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-source.outputs.source-commit }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.source-commit }}
            org.opencontainers.image.version=${{ needs.resolve-source.outputs.build-image }}
          cache-from: |
            type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.platform-pair }}-${{ needs.resolve-source.outputs.cache-scope }}
            type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.platform-pair }}-${{ needs.resolve-source.outputs.default-branch-cache-scope }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.platform-pair }}-${{ needs.resolve-source.outputs.cache-scope }},mode=max,compression=zstd
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ needs.resolve-source.outputs.build-image }}
            BUILD_SOURCE_REF=${{ needs.resolve-source.outputs.source-ref }}
            BUILD_SOURCE_COMMIT=${{ needs.resolve-source.outputs.source-commit }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: immich-server-digests-${{ matrix.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Publish multi-arch manifest
    needs: [resolve-source, build]
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.resolve-source.outputs.image }}
      TAGS: ${{ needs.resolve-source.outputs.tags }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/digests
          pattern: immich-server-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_arguments=()
          for tag in ${TAGS}; do
            tag_arguments+=(--tag "${IMAGE}:${tag}")
          done

          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_arguments[@]}" "${sources[@]}"

      - name: Inspect manifest and summarize
        env:
          SOURCE_REF: ${{ needs.resolve-source.outputs.source-ref }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source-commit }}
        run: |
          first_tag="${TAGS%% *}"
          docker buildx imagetools inspect "${IMAGE}:${first_tag}"

          {
            echo "### ${IMAGE}"
            echo
            echo "Source: \`${SOURCE_REF}\` at \`${SOURCE_COMMIT}\`"
            echo
            for tag in ${TAGS}; do
              echo "- \`${IMAGE}:${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
