name: Fork Build Image

# Builds ghcr.io/<owner>/immich-server-allamiro from this fork. Every image names this repository as
# its source: the build metadata that server/Dockerfile bakes in is rewritten before the build, the
# image carries the fork's OCI labels, provenance and SBOM, and a GitHub attestation ties the
# published digest to this workflow and commit. The helper scripts in .github/fork are taken from
# the workflow's own commit, so any branch or tag can be built, including upstream-based release
# branches that do not contain them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build. Empty builds the branch the workflow is started from.
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*-fork.*']

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPOSITORY: immich-app/immich
  UPSTREAM_BRANCH: main
  PLATFORMS: linux/amd64 linux/arm64

jobs:
  resolve-source:
    name: Resolve source and tags
    if: >-
      ${{
        github.repository_owner != 'immich-app' &&
        !(
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.event.head_commit.author.name == 'github-actions[bot]' &&
          startsWith(github.event.head_commit.message, 'chore: merge upstream ')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.source.outputs.image }}
      package: ${{ steps.source.outputs.package }}
      cache-image: ${{ steps.source.outputs.cache-image }}
      cache-scope: ${{ steps.source.outputs.cache-scope }}
      default-branch-cache-scope: ${{ steps.source.outputs.default-branch-cache-scope }}
      source-ref: ${{ steps.source.outputs.source-ref }}
      source-commit: ${{ steps.source.outputs.source-commit }}
      build-image: ${{ steps.source.outputs.build-image }}
      tags: ${{ steps.source.outputs.tags }}
      release: ${{ steps.source.outputs.release }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      latest: ${{ steps.source.outputs.latest }}
      previous-tag: ${{ steps.source.outputs.previous-tag }}
      base: ${{ steps.source.outputs.base }}
      docs-url: ${{ steps.source.outputs.docs-url }}
      labels: ${{ steps.source.outputs.labels }}
      upstream-base-commit: ${{ steps.upstream-release.outputs.commit }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: source
          persist-credentials: false

      - name: Checkout fork tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          sparse-checkout: .github/fork
          persist-credentials: false

      - name: Resolve image name, source, tags and labels
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          TRIGGER_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          source_ref="${REQUESTED_REF:-$TRIGGER_REF_NAME}"
          requested_as_tag=false
          if [[ "$source_ref" == refs/tags/* ]] || [[ -z "$REQUESTED_REF" && "$TRIGGER_REF_TYPE" == tag ]]; then
            requested_as_tag=true
          fi
          source_ref="${source_ref#refs/heads/}"
          source_ref="${source_ref#refs/tags/}"
          source_commit=$(git -C source rev-parse HEAD)

          all_tags=$(gh api "repos/${REPOSITORY}/git/matching-refs/tags/" --paginate --jq '.[].ref | sub("^refs/tags/"; "")')
          is_tag=false
          if [[ "$requested_as_tag" == true ]] || grep -qxF "$source_ref" <<< "$all_tags"; then
            is_tag=true
            tag_commit=$(gh api "repos/${REPOSITORY}/commits/refs/tags/${source_ref}" --jq .sha)
            if [[ "$tag_commit" != "$source_commit" ]]; then
              echo "::error::Tag ${source_ref} points at ${tag_commit}, but the checkout is ${source_commit}."
              exit 1
            fi
          fi

          upstream_main_base=''
          if [[ "$is_tag" != true ]]; then
            upstream_main_base=$(gh api "repos/${REPOSITORY}/compare/${UPSTREAM_REPOSITORY%%/*}:${UPSTREAM_BRANCH}...${source_commit}" \
              --jq .merge_base_commit.sha) || {
              echo "::warning::Could not compute the merge base with upstream ${UPSTREAM_BRANCH}; the base label reads upstream-main."
              upstream_main_base=''
            }
          fi

          fork_doc_in_source=false
          if [[ -f source/FORK.md ]]; then
            fork_doc_in_source=true
          fi

          SOURCE_REF="$source_ref" SOURCE_COMMIT="$source_commit" IS_TAG="$is_tag" \
            PACKAGE_VERSION="$(jq -r '.version // empty' source/server/package.json)" \
            FORK_TAGS="$all_tags" UPSTREAM_MAIN_BASE="$upstream_main_base" FORK_DOC_IN_SOURCE="$fork_doc_in_source" \
            tools/.github/fork/resolve-image-source.sh | tee -a "$GITHUB_OUTPUT"

      - name: Check the upstream release the tag is based on
        id: upstream-release
        if: ${{ steps.source.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ steps.source.outputs.base }}
          SOURCE_REF: ${{ steps.source.outputs.source-ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source-commit }}
        run: |
          if ! upstream_commit=$(gh api "repos/${UPSTREAM_REPOSITORY}/commits/refs/tags/${BASE}" --jq .sha); then
            echo "::error::${SOURCE_REF} names upstream ${BASE} as its base, but ${UPSTREAM_REPOSITORY} has no tag ${BASE}."
            exit 1
          fi
          status=$(gh api "repos/${REPOSITORY}/compare/${upstream_commit}...${SOURCE_COMMIT}" --jq .status)
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "::error::${SOURCE_REF} (${SOURCE_COMMIT}) does not contain upstream ${BASE} (${upstream_commit}); compare status '${status}'."
            exit 1
          fi
          echo "commit=${upstream_commit}" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve-source
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform-pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform-pair: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.resolve-source.outputs.image }}
      CACHE_IMAGE: ${{ needs.resolve-source.outputs.cache-image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-source.outputs.source-commit }}
          path: source
          persist-credentials: false

      - name: Checkout fork tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          sparse-checkout: .github/fork
          persist-credentials: false

      - name: Point the build metadata at this repository
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source-commit }}
          PACKAGE: ${{ needs.resolve-source.outputs.package }}
          FORK_SERVER_URL: ${{ github.server_url }}
        run: tools/.github/fork/rebrand-dockerfile.sh source/server/Dockerfile "$REPOSITORY" "$RUN_ID" "$SOURCE_COMMIT" "$PACKAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: source
          file: source/server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.resolve-source.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.platform-pair }}-${{ needs.resolve-source.outputs.cache-scope }}
            type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.platform-pair }}-${{ needs.resolve-source.outputs.default-branch-cache-scope }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.platform-pair }}-${{ needs.resolve-source.outputs.cache-scope }},mode=max,compression=zstd
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ needs.resolve-source.outputs.build-image }}
            BUILD_SOURCE_REF=${{ needs.resolve-source.outputs.source-ref }}
            BUILD_SOURCE_COMMIT=${{ needs.resolve-source.outputs.source-commit }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: immich-server-digests-${{ matrix.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Publish multi-arch manifest
    needs: [resolve-source, build]
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      IMAGE: ${{ needs.resolve-source.outputs.image }}
      TAGS: ${{ needs.resolve-source.outputs.tags }}
      LABELS: ${{ needs.resolve-source.outputs.labels }}
      SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source-commit }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/digests
          pattern: immich-server-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          arguments=()
          for tag in ${TAGS}; do
            arguments+=(--tag "${IMAGE}:${tag}")
          done
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then
              arguments+=(--annotation "index:${label}")
            fi
          done <<< "$LABELS"

          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${arguments[@]}" "${sources[@]}"

      - name: Read the manifest list digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${SOURCE_COMMIT::7}" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the digest of ${IMAGE}:${SOURCE_COMMIT::7}."
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE}@${digest}"
          echo "digest=${digest}" | tee -a "$GITHUB_OUTPUT"

  attest:
    name: Attest build provenance
    needs: [resolve-source, merge-manifest]
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the manifest list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.resolve-source.outputs.image }}
          subject-digest: ${{ needs.merge-manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

